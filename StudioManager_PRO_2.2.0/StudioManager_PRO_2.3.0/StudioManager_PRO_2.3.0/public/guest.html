<style>
:root{--gold:#b8862b;--ink:#201c18;--muted:#756d63;--line:#e5ddd2;--soft:#faf7f2;--green:#187b56}
*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:var(--ink);font-family:Heebo,Rubik,Arial,sans-serif;line-height:1.65}
.shell{max-width:980px;margin:0 auto;padding:22px 16px 60px}.hero{background:#1d1d1c;color:#fff;border-radius:22px;padding:30px 26px;margin-bottom:18px;position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;left:24px;top:2px;color:#b8862b;font-size:100px;opacity:.16}.eyebrow{color:#e3c98b;font-size:12px;letter-spacing:.1em}.hero h1{font-family:Georgia,serif;font-size:clamp(25px,5vw,36px);margin:5px 0 8px}.hero p{margin:0;color:#e4e0d9}.brand{font-weight:700;font-size:14px;color:#e7cf98}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 24px #3b2d1808}.section-title{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:20px}.section-title:before{content:"";width:5px;height:23px;border-radius:8px;background:var(--gold)}.muted{color:var(--muted);font-size:13px}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:18px}.meta div{background:#292927;border:1px solid #45423b;border-radius:12px;padding:10px 13px}.meta span{display:block;color:#c5b99f;font-size:11px}.meta strong{display:block;color:white;font-size:14px}.packages{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.package{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff;cursor:pointer;transition:.16s;min-width:0}.package.selected{border:2px solid var(--gold);box-shadow:0 0 0 3px #b8862b22}.package-photo{width:100%;height:var(--photo-height,260px);position:relative;overflow:hidden;background:linear-gradient(135deg,#eee6d7,#fff);display:grid;place-items:center}.package-photo img,.package-photo .no-image{width:100%;height:100%;object-fit:var(--photo-fit,cover);object-position:var(--photo-position,center center);display:grid;place-items:center;color:#a58a58;font-size:30px}.package .badge.floating{position:absolute;z-index:2}.package-body{padding:15px;text-align:var(--package-text-align,right)}.package[data-image-placement="bottom"]{display:flex;flex-direction:column}.package[data-image-placement="bottom"] .package-photo{order:2}.package[data-image-placement="bottom"] .package-body{order:1}.package[data-image-placement="right"],.package[data-image-placement="left"]{display:grid;grid-template-columns:minmax(95px,36%) minmax(0,1fr);grid-template-rows:1fr}.package[data-image-placement="right"] .package-photo{grid-column:1;grid-row:1;height:auto;min-height:var(--photo-height,260px)}.package[data-image-placement="right"] .package-body{grid-column:2;grid-row:1}.package[data-image-placement="left"] .package-photo{grid-column:2;grid-row:1;height:auto;min-height:var(--photo-height,260px)}.package[data-image-placement="left"] .package-body{grid-column:1;grid-row:1}.package[data-card-size="wide"]{grid-column:span 2}.package[data-card-size="full"]{grid-column:1/-1}.package-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.package h3{margin:0;font-size:17px}.badge{background:#f4ead2;color:#805913;border-radius:50px;padding:3px 9px;font-size:11px}.price{font-size:23px;font-weight:800;color:#9b6c16;margin:7px 0}.desc{font-size:13px;color:var(--muted)}.details{font-size:13px;white-space:pre-line;border-top:1px solid #eee8df;margin-top:11px;padding-top:10px}.select-hint{font-size:12px;color:#9d741f;margin-top:12px;font-weight:700}.builder-panel{display:none}.builder-group{border:1px solid var(--line);border-radius:13px;padding:13px;margin:12px 0}.builder-group h3{font-size:15px;margin:0 0 8px;color:#76520e}.builder-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}.builder-option{display:grid;grid-template-columns:1fr 82px;gap:10px;align-items:center;background:#fcfbf8;border:1px solid #eee8df;border-radius:10px;padding:10px}.builder-option strong{display:block;font-size:13px}.builder-option small{display:block;color:var(--muted);font-size:11px}.builder-option input{width:100%;min-width:0;border:1px solid #d9d1c6;border-radius:8px;padding:8px;font:inherit;text-align:center}.builder-note{background:#fff8e8;border:1px solid #ead8ac;border-radius:10px;padding:11px;font-size:12px;color:#6d521b;margin-top:12px}.builder-total{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.builder-total strong{font-size:22px;color:#8f6417}.summary{background:var(--soft);border:1px solid #eadfc9;border-radius:13px;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.summary strong{font-size:25px;color:#8f6417}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #d9d1c6;border-radius:10px;padding:12px;font:inherit;background:#fff;color:var(--ink)}.field textarea{min-height:100px;white-space:pre-wrap}.terms{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:16px;background:#fdfcf9}.term{margin:0 0 12px;font-size:13px;white-space:pre-wrap}.term b{color:#76520e}.sign-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sign-card{border:1px solid var(--line);border-radius:14px;padding:13px}.sign-card h3{margin:0 0 10px;font-size:15px}.sign-canvas{width:100%;height:150px;border:1px dashed #c9bda9;border-radius:10px;background:#fff;touch-action:none;display:block}.sign-tools{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.sign-tools button{border:0;background:none;color:#8b631c;cursor:pointer;font:inherit;font-size:12px}.consent{display:flex;gap:9px;align-items:flex-start;background:var(--soft);border-radius:10px;padding:12px;font-size:13px;margin-top:12px}.consent input{margin-top:5px;accent-color:var(--gold)}.radio-line{display:flex;gap:20px;flex-wrap:wrap;margin-top:8px}.radio-line label{display:flex;gap:7px;align-items:center;font-size:13px}.btn{border:0;border-radius:11px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:#1e1e1d;color:#fff}.btn.gold{background:var(--gold);color:#fff}.btn:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.success{display:none;text-align:center;padding:24px;border:1px solid #b6ddcb;background:#effaf4;border-radius:16px;color:#176444}.error{color:#a72e2e;background:#fff1ef;border-radius:10px;padding:12px;margin-top:12px;display:none}.foot{color:#8a8176;font-size:11px;text-align:center;margin-top:22px}.loading{text-align:center;padding:50px;color:var(--muted)}
@media(max-width:650px){.fields,.sign-grid{grid-template-columns:1fr}.hero{padding:24px 20px}.panel{padding:17px}.summary{align-items:flex-start;flex-direction:column}.package[data-card-size="wide"],.package[data-card-size="full"]{grid-column:1/-1}.package[data-image-placement="right"],.package[data-image-placement="left"]{display:flex;flex-direction:column}.package[data-image-placement="right"] .package-photo,.package[data-image-placement="left"] .package-photo{height:var(--photo-height,260px);min-height:0;order:0}.package[data-image-placement="right"] .package-body,.package[data-image-placement="left"] .package-body{order:1}}
@media print{.success{display:none!important}.error{display:none!important}body{background:#fff}.shell{max-width:none;padding:0}.hero,.panel{box-shadow:none;break-inside:avoid}.actions,.foot,.select-hint{display:none!important}.terms{max-height:none;overflow:visible}.package{break-inside:avoid}}
</style></head>
<body><div class="shell" id="app"><div class="loading">טוען את ההצעה האישית…</div></div>
<script>
(()=>{
const token=location.pathname.split('/').filter(Boolean).pop();let proposal=null,selected=null,pads={},customRequestSent=false;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0}).format(Number(v)||0);const date=v=>{if(!v)return '—';const d=new Date(v+'T00:00:00');return d.toLocaleDateString('he-IL',{day:'2-digit',month:'long',year:'numeric'})};
function builderSelection(){const options=proposal?.builderOptions||[];return Array.from(document.querySelectorAll('[data-builder-qty]')).map(el=>({id:el.dataset.builderQty,quantity:Math.max(0,Math.min(10,Math.floor(Number(el.value)||0)))})).filter(x=>x.quantity>0).map(x=>{const o=options.find(y=>y.id===x.id);return o?{id:o.id,name:o.name,category:o.category,unit:o.unit,quantity:x.quantity}:null}).filter(Boolean)}
function builderDetails(items){return items.map(x=>`${x.name} – ${x.quantity} ${x.unit}`).join('\n')}
function updateSelectionUI(){if(!proposal)return;const p=(proposal.packages||[]).find(x=>x.id===selected);const isBuilder=!!p?.isBuilder;const panel=$('builderPanel'),summary=$('selectionSummary'),signing=$('signatureFlow'),planning=$('planningSection');if(panel)panel.style.display=isBuilder?'block':'none';if(summary)summary.style.display=isBuilder?'none':'flex';if(signing)signing.style.display=isBuilder?'none':'block';if(planning)planning.style.display=isBuilder?'none':'block';const name=isBuilder?'חבילה בהתאמה אישית':(p?.name||'');if($('selectedName'))$('selectedName').textContent=name;if($('selectedPrice'))$('selectedPrice').textContent=isBuilder?'הצעת מחיר תישלח לאחר בדיקת הבחירה':money(p?.price||0);if($('balanceDue'))$('balanceDue').textContent=isBuilder?'לאחר הצעת מחיר':money(Math.max(0,(Number(p?.price)||0)-(proposal.event.payments||[]).reduce((a,x)=>a+(Number(x.amount)||0),0)));const totals=builderSelection(),requestBtn=$('requestCustomQuote'),summaryText=$('builderPriceSummary');if(summaryText)summaryText.innerHTML=totals.length?`נבחרו ${totals.length} סוגי שירותים. לאחר השליחה הבחירה תגיע לצלם, והוא יחזור אליכם עם הצעת מחיר אישית.`:'סמנו את השירותים והכמויות הרצויים. אין מחירים במסך הזה.';if(requestBtn){requestBtn.style.display='inline-block';requestBtn.disabled=!totals.length;requestBtn.textContent=totals.length?'שליחת הבחירה לקבלת הצעת מחיר':'בחרו שירותים כדי להמשיך';}}
function builderPanelMarkup(options){const groups={};options.filter(x=>x.active!==false).forEach(o=>(groups[o.category||'שירותים']??=[]).push(o));return `<section class="panel builder-panel" id="builderPanel"><h2 class="section-title">בנו את חבילת הצילום שלכם</h2><p class="muted">סמנו את השירותים והמוצרים שתרצו, ובחרו כמות לכל אחד. הבחירה תישלח לצלם בלבד – הצעת מחיר אישית תישלח אליכם לאחר בדיקה.</p>${Object.entries(groups).map(([category,rows])=>`<div class="builder-group"><h3>${esc(category)}</h3><div class="builder-options">${rows.map(o=>`<label class="builder-option"><span><strong>${esc(o.name)}</strong><small>בחירת כמות · ${esc(o.unit||'יחידה')}</small></span><input type="number" min="0" max="10" step="1" value="0" data-builder-qty="${esc(o.id)}" aria-label="כמות ${esc(o.name)}"></label>`).join('')}</div></div>`).join('')||'<p class="muted">לא הוגדרו שירותים זמינים. אפשר לפנות לצלם.</p>'}<div class="field" style="margin-top:14px"><label for="builderExtraRequests">שירות נוסף או בקשה מיוחדת שלא מופיעים ברשימה (לא חובה)</label><textarea id="builderExtraRequests" maxlength="1500" placeholder="כתבו כאן כל תוספת או בקשה מיוחדת…"></textarea></div><div class="builder-note">הבחירה אינה הצעת מחיר ואינה הזמנה מחייבת. לאחר שתקבל את הבקשה, הצלם יבדוק את כל הפרטים וישלח הצעת מחיר אישית לאישורכם.</div><div id="builderPriceSummary" class="summary" style="margin-top:12px">סמנו את השירותים והכמויות הרצויים.</div><div class="error" id="builderErrorBox"></div><div class="actions"><button type="button" class="btn gold" id="requestCustomQuote" disabled>בחרו שירותים כדי להמשיך</button></div></section>`}
let deferredInstallPrompt=null;
function setupGuestPwa(){
  const link=document.createElement('link');link.rel='manifest';link.href='/app.webmanifest?token='+encodeURIComponent(token);document.head.appendChild(link);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/p/service-worker.js',{scope:'/p/'}).catch(()=>{});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;const b=$('installOfferApp');if(b)b.style.display='inline-flex';});
}
async function installOfferApp(){
  if(deferredInstallPrompt){deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice;}catch{}deferredInstallPrompt=null;return;}
  alert('ב-Chrome באנדרואיד: פתחו את תפריט ⋮ ובחרו „הוספה למסך הבית” או „התקנת אפליקציה”. הקישור ייפתח כמו אפליקציה.');
}
function renderQuote(){
  selected=null;const e=proposal.event||{},biz=proposal.business||{},packages=proposal.packages||[],options=proposal.builderOptions||[];
  const cards=packages.map(p=>`<article class="package" data-quote-package="${esc(p.id)}" data-image-placement="${esc(p.imagePlacement||'top')}" data-card-size="${esc(p.cardSize||'normal')}" style="--photo-height:${Math.max(140,Math.min(420,Number(p.imageHeight)||260))}px;--photo-fit:${p.imageFit==='contain'?'contain':'cover'};--photo-position:${esc(p.imagePosition||'center center')};--package-text-align:${esc(p.textAlign||'right')}"><div class="package-photo">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:`<div class="no-image">✦</div>`}${p.badge?`<span class="badge floating">${esc(p.badge)}</span>`:''}</div><div class="package-body"><h3>${esc(p.name)}</h3>${p.isBuilder?'<div class="price">בחירה אישית – הצעת מחיר לאחר שליחה</div>':(proposal.showPrices?`<div class="price">${money(p.price)}</div>`:'<div class="price">הצעת מחיר לפי בחירה</div>')}<div class="desc">${esc(p.description||'')}</div><div class="details">${esc(p.details||'')}</div><div class="select-hint">לחצו לבחירת החבילה</div></div></article>`).join('');
  $('app').innerHTML=`<header class="hero"><div class="brand">${esc(biz.name||'צילום ברמה אחרת – אופיר מרדכי')}</div><div class="eyebrow">קטלוג והצעת מחיר אישית</div><h1>בחרו את חבילת הצילום המתאימה לכם</h1><p>עיינו בחבילות, בחרו את מה שמעניין אתכם ושלחו את הבחירה לצלם. לאחר בדיקה תקבלו הצעת מחיר מסודרת. הבחירה אינה מחייבת.</p><div class="meta"><div><span>סוג האירוע</span><strong>${esc(e.typeLabel||'אירוע')}</strong></div><div><span>תאריך</span><strong>${date(e.date)}</strong></div><div><span>מיקום</span><strong>${esc(e.venue||'טרם צוין')}</strong></div><div><span>יצירת קשר</span><strong>${esc(biz.phone||'')}</strong></div></div></header>
  <section class="panel"><h2 class="section-title">חבילות צילום</h2><p class="muted">בחרו חבילה אחת. ניתן גם לבחור „בנה חבילה בעצמך” ולסמן שירותים וכמויות.</p><div class="packages">${cards||'<p class="muted">כרגע אין חבילות להצגה.</p>'}</div></section>
  <div id="quoteBuilderWrap" style="display:none">${builderPanelMarkup(options)}</div>
  <section class="panel"><h2 class="section-title">פרטי קשר</h2><p class="muted">כדי שנוכל לחזור אליכם עם הצעת המחיר, יש להשאיר שם וטלפון.</p><div class="fields"><div class="field"><label for="quoteClientName">שם מלא *</label><input id="quoteClientName" maxlength="120" value="${esc(e.clientName||'')}" placeholder="שם פרטי ומשפחה"></div><div class="field"><label for="quoteClientPhone">טלפון *</label><input id="quoteClientPhone" inputmode="tel" maxlength="40" value="${esc(e.clientPhone||'')}" placeholder="מספר טלפון זמין"></div><div class="field"><label for="quoteClientEmail">דוא״ל</label><input id="quoteClientEmail" type="email" maxlength="160" value="${esc(e.clientEmail||'')}" placeholder="כתובת דוא״ל"></div><div class="field"><label for="quoteClientNote">הערות / בקשות מיוחדות</label><textarea id="quoteClientNote" maxlength="1500" placeholder="כתבו לנו מה חשוב לכם לדעת…"></textarea></div></div><div class="error" id="quoteError"></div><div class="actions"><button class="btn primary" id="sendQuoteSelection" type="button">שליחת הבחירה לצלם</button><button class="btn" id="installOfferApp" type="button" onclick="" style="display:inline-flex">הוספה למסך הבית</button></div><p class="muted">אין צורך להוריד אפליקציה מחנות. אפשר לפתוח את הקישור בדפדפן, ובמכשירים תומכים להוסיף אותו למסך הבית.</p></section><div class="success" id="quoteSuccess"><h2>הבחירה נשלחה בהצלחה!</h2><p>קיבלנו את הבחירה שלכם. הצלם יעבור עליה ויחזור אליכם עם הצעת מחיר.</p></div><p class="foot">${esc(biz.name||'צילום ברמה אחרת')} · קישור אישי להצעת מחיר</p>`;
  function choose(id){selected=id;document.querySelectorAll('[data-quote-package]').forEach(card=>{const on=card.dataset.quotePackage===id;card.classList.toggle('selected',on);const hint=card.querySelector('.select-hint');if(hint)hint.textContent=on?'✓ נבחרה':'לחצו לבחירת החבילה'});const picked=packages.find(x=>x.id===id);const wrap=$('quoteBuilderWrap');if(wrap)wrap.style.display=picked?.isBuilder?'block':'none';const bp=$('builderPanel');if(bp)bp.style.display=picked?.isBuilder?'block':'none';const send=$('sendQuoteSelection');if(send){send.style.display=picked?.isBuilder?'none':'inline-flex';send.disabled=!picked||!!picked.isBuilder;}}
  document.querySelectorAll('[data-quote-package]').forEach(card=>card.addEventListener('click',()=>choose(card.dataset.quotePackage)));
  $('sendQuoteSelection').addEventListener('click',submitQuoteSelection);$('sendQuoteSelection').disabled=true;
  $('installOfferApp').addEventListener('click',installOfferApp);
  document.querySelectorAll('[data-builder-qty]').forEach(el=>el.addEventListener('input',()=>{const total=builderSelection().length;const box=$('builderPriceSummary');if(box)box.textContent=total?`נבחרו ${total} סוגי שירותים. הבחירה תישלח לצלם לתמחור.`:'בחרו שירותים וכמויות.'}));
  const builderBtn=$('requestCustomQuote');if(builderBtn)builderBtn.addEventListener('click',requestCustomQuote);
  if(proposal.status==='quote-requested'){document.querySelectorAll('#app .panel').forEach(x=>x.style.opacity='.7');$('quoteSuccess').style.display='block';$('quoteSuccess').scrollIntoView({block:'center'});}
}
async function submitQuoteSelection(){
  const p=(proposal.packages||[]).find(x=>x.id===selected);if(!p)return showQuoteError('יש לבחור חבילה אחת לפני השליחה.');
  const clientName=$('quoteClientName').value.trim(),clientPhone=$('quoteClientPhone').value.trim(),clientEmail=$('quoteClientEmail').value.trim();
  if(!clientName||!clientPhone)return showQuoteError('יש למלא שם מלא ומספר טלפון.');
  if(clientEmail&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clientEmail))return showQuoteError('כתובת הדוא״ל אינה תקינה.');
  const btn=$('sendQuoteSelection');btn.disabled=true;btn.textContent='שולח את הבחירה…';
  try{const r=await fetch('/api/public/proposals/'+encodeURIComponent(token)+'/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selectedPackageId:p.id,clientName,clientPhone,clientEmail,clientNote:$('quoteClientNote').value.trim()})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'לא ניתן לשלוח את הבחירה');proposal.status='quote-requested';$('quoteSuccess').style.display='block';$('quoteSuccess').scrollIntoView({behavior:'smooth',block:'center'});document.querySelectorAll('#app .panel').forEach(x=>x.style.opacity='.72');btn.textContent='הבחירה נשלחה';}catch(err){showQuoteError(err.message);btn.disabled=false;btn.textContent='שליחת הבחירה לצלם';}
}
function showQuoteError(message){const box=$('quoteError');if(box){box.textContent=message;box.style.display='block';}}
function render(){const e=proposal.event||{},biz=proposal.business||{},c=proposal.contract||{},packages=proposal.packages||[],builderOptions=proposal.builderOptions||[];const terms=String(c.terms||'').split(/\n\s*\n|\n/).map(x=>x.trim()).filter(Boolean);const chosen=packages.find(p=>p.id===selected)||packages[0];const style=proposal.contractStyle||{};const fontMap={Heebo:'Heebo,Arial,sans-serif',Rubik:'Rubik,Arial,sans-serif',Assistant:'Assistant,Arial,sans-serif','Noto Sans Hebrew':'Arial,sans-serif','David Libre':'Georgia,serif',Arial:'Arial,sans-serif'};document.body.style.fontFamily=fontMap[style.fontFamily]||'Heebo,Arial,sans-serif';

function bindPad(id){const c=$(id),ctx=c.getContext('2d');ctx.strokeStyle='#171717';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';let drawing=false;const pos=e=>{const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});c.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()});const stop=()=>drawing=false;c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);pads[id]=c;}

async function submit(){const box=$('errorBox');box.style.display='none';let p=proposal.packages.find(x=>x.id===selected);if(p?.isBuilder)return showError('בחבילה בהתאמה אישית יש לשלוח את בחירת השירותים לצלם לקבלת הצעת מחיר. אין חתימה בשלב זה.');const n1=$('signer1Name').value.trim(),n2=$('signer2Name').value.trim(),pub=document.querySelector('input[name="publication"]:checked')?.value;if(!p){return showError('יש לבחור חבילת צילום.')}if(!n1||!n2){return showError('יש למלא את השמות של שני המזמינים.')}const clientPhone=$('clientPhone').value.trim();if(!clientPhone){return showError('יש להזין מספר טלפון ליצירת קשר.')}if($('clientEmail').value.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('clientEmail').value.trim())){return showError('כתובת הדוא״ל אינה תקינה.')}if(!hasInk(pads.sig1)||!hasInk(pads.sig2)){return showError('נדרשות שתי חתימות לפני השליחה.')}if(!pub){return showError('יש לבחור האם מאשרים שימוש בתמונות לפרסום.')}if(!$('agreementAccepted').checked){return showError('יש לאשר שקראתם והסכמתם לתנאי ההסכם.')}const btn=$('submitSign');btn.disabled=true;btn.textContent='שולח חתימות מאובטחות…';try{const r=await fetch('/api/public/proposals/'+encodeURIComponent(token)+'/sign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selectedPackageId:p.id,customPackageItems:p.customItems||[],signer1Name:n1,signer2Name:n2,clientPhone:$('clientPhone').value.trim(),clientEmail:$('clientEmail').value.trim(),clientIdNumber:$('clientIdNumber').value.trim(),clientAddress:$('clientAddress').value.trim(),clientNote:$('clientNote').value.trim(),signature1:pads.sig1.toDataURL('image/png'),signature2:pads.sig2.toDataURL('image/png'),publicationConsent:pub,agreementAccepted:true,clientDetailsConfirmed:true,questionnaire:{dayContact:$('eventContact').value.trim(),dayPhone:$('eventContactPhone').value.trim(),prepTime:$('eventPrepTime').value,timeline:$('eventTimeline').value.trim(),mustPhotograph:$('eventMustShots').value.trim(),styleRequests:$('eventStyleRequests').value.trim(),restrictions:$('eventRestrictions').value.trim(),completed:true}})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'לא ניתן לשמור את החתימות');proposal.status=proposal.mode==='demo'?'demo-completed':'signed';const e=proposal.event;e.clientName=n1;e.clientSecondName=n2;e.clientPhone=clientPhone;e.clientEmail=$('clientEmail').value.trim();e.clientIdNumber=$('clientIdNumber').value.trim();e.clientAddress=$('clientAddress').value.trim();e.clientNote=$('clientNote').value.trim();e.packageName=p.name;e.packageDetails=p.details;e.price=p.price;e.discount=0;proposal.submission=j.submission;renderSigned();}catch(err){showError(err.message);btn.disabled=false;btn.textContent='אישור וחתימה על ההסכם';}}
async function requestCustomQuote(){const items=builderSelection();if(!items.length)return showError('יש לבחור לפחות שירות אחד.');const quoteMode=proposal?.mode==='quote';const val=id=>$(quoteMode?'quote'+id[0].toUpperCase()+id.slice(1):id)?.value?.trim()||'';const clientName=val('clientName')||proposal.event.clientName||'';const clientPhone=val('clientPhone');if(!clientName)return showError('יש למלא שם מלא.');if(!clientPhone)return showError('יש להזין טלפון כדי שנוכל לחזור אליכם.');const btn=$('requestCustomQuote');btn.disabled=true;btn.textContent='שולח את הבחירה…';try{const r=await fetch('/api/public/proposals/'+encodeURIComponent(token)+'/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientName,clientPhone,clientEmail:val('clientEmail'),clientAddress:val('clientAddress'),clientNote:(val('clientNote')||$('builderExtraRequests')?.value?.trim()||''),extraRequests:$('builderExtraRequests')?.value?.trim()||'',items:items.map(x=>({id:x.id,quantity:x.quantity}))})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'לא ניתן לשלוח את הבחירה');builderSelectionSnapshot=items;renderRequestSent(j.requestedAt,$('builderExtraRequests')?.value?.trim()||'',clientName);}catch(err){showError(err.message);btn.disabled=false;btn.textContent='שליחת הבחירה לקבלת הצעת מחיר'}}
