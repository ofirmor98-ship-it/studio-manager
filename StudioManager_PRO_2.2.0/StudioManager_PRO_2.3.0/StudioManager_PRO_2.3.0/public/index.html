7. שינויים, תוספות ושעות צילום נוספות
כל שינוי בחבילה, בכמות התוצרים, במיקום או בלוח הזמנים ייעשה בתיאום ובאישור בכתב. צילום מעבר לשעות שסוכמו או שירותים נוספים יחויבו רק לאחר תיאום ואישור המזמין, בהתאם לתעריף שסוכם מראש.
8. ביטול, דחייה ושינוי מועד
במקרה של ביטול, דחיית אירוע או בקשה לשינוי מועד, המזמין יודיע לנותן השירות בכתב בהקדם האפשרי. דמי המקדמה, דמי הביטול, אפשרות העברת המקדמה למועד חלופי והחיובים במקרה של ביטול ייקבעו בפרטי ההזמנה או בנספח כתוב ומפורש, ויהיו כפופים להוראות הדין. אין להסתמך על תנאי ביטול שלא מולאו או שלא אושרו במפורש.
9. בחירת תמונות, אישורי עיצוב ותיקונים
ככל שהחבילה כוללת אלבום או מוצר מודפס, המזמין יעביר את בחירת התמונות והאישורים הנדרשים במועד סביר. העיכוב בהעברת בחירות או אישורים עשוי לדחות את מועד האספקה. תיקונים ושינויים בעיצוב יבוצעו בהתאם להיקף שסוכם מראש ובכתב.
10. מועדי מסירה ודרך קבלת התוצרים
מועדי המסירה של התמונות, סרטוני הווידאו והאלבומים יפורטו באזור מועדי המסירה בהסכם. המסירה תבוצע באמצעי שנקבע בין הצדדים, כגון קישור, אפליקציה, התקן USB או מוצר מודפס. על המזמין לבדוק את התוצרים בסמוך לקבלתם ולעדכן על תקלה בקובץ או במוצר.
11. חומרי גלם וקבצים שלא נכללו בחבילה
המסירה כוללת את התוצרים הסופיים המפורטים בחבילה בלבד. קובצי מקור, חומרי גלם, קובצי RAW, פרויקטים פתוחים וקובצי עריכה אינם כלולים, אלא אם נרשמו במפורש בהזמנה ובתמורה שסוכמה.
12. גיבוי ושמירת חומרים
נותן השירות ישמור את חומרי העבודה ואת התוצרים עד למסירתם בהתאם להסכם ובמאמצים סבירים לגיבוי. לאחר מסירת התוצרים, המזמין אחראי להורידם ולשמור עותק גיבוי במקום נוסף. תקופת שמירת החומרים לאחר המסירה, ככל שתינתן, תיקבע בכתב; אין לראות בקישור צפייה או הורדה תחליף לגיבוי עצמאי.
13. זכויות יוצרים ורישיון שימוש ללקוח
זכויות היוצרים בתצלומים ובסרטונים יישמרו בהתאם להוראות הדין. המזמין יקבל רשות שימוש פרטית בתוצרים שנמסרו לו, לצרכיו האישיים והמשפחתיים, ולא יעשה בהם שימוש מסחרי או יעביר זכויות לצד שלישי ללא הסכמה מראש ובכתב, ככל שנדרשת הסכמה כזו לפי דין.
14. אישור נפרד לשימוש בתמונות לצורכי פרסום
שימוש בתמונות או בסרטונים של המזמין, בני משפחתו או אורחיו לצורכי תיק עבודות, אתר, רשתות חברתיות או פרסום ייעשה רק בהתאם לבחירת ההסכמה המפורשת המופיעה בהסכם. אי מתן הסכמה לא יפגע בשירות המוזמן.
15. רחפן, תנאי חוץ ואישורים
צילום רחפן או צילום חוץ, ככל שנכללו בחבילה, כפופים למזג האוויר, תנאי בטיחות, מגבלות המקום, הוראות הרשויות ואישורי תעופה. אם לא ניתן לבצע צילום כאמור מסיבה שאינה בשליטת נותן השירות, הצדדים יתאמו חלופה סבירה או יעדכנו את ההזמנה בהתאם.
16. תקלות, כוח עליון ואירועים שאינם בשליטת הצדדים
הצדדים יעדכנו זה את זה ללא דיחוי על אירוע חריג, מגבלה או תקלה העלולים להשפיע על ביצוע השירות. במקרה של נסיבות שאינן בשליטת הצדדים, יפעלו הצדדים בתום לב למציאת פתרון סביר, לרבות שינוי מועד או התאמת השירות, בכפוף לדין ולהסכמה בכתב.
17. פרטיות ושמירת פרטים
פרטי המזמין והמידע שנמסר לצורך ביצוע ההזמנה ישמשו לניהול ההתקשרות, לתיאום האירוע ולמסירת התוצרים. נותן השירות ינקוט אמצעים סבירים לשמירת המידע ולא יעבירו לאחרים אלא לצורך ביצוע השירות או בהתאם לדין.
18. שינויים בהסכם וסדר עדיפויות
כל שינוי או תוספת להסכם יהיו תקפים רק אם תועדו בכתב ואושרו על ידי שני הצדדים. במקרה של סתירה, פירוט ההזמנה והנספחים שאושרו לאחרונה בכתב יגברו ביחס לפרט הספציפי שעליו הם חלים.
19. אזור השירות והוצאות נסיעה
השירות ניתן בכל רחבי הארץ ללא תוספת תשלום על מרחק, בהתאם להצעה שנמסרה למזמין, אלא אם סוכם אחרת במפורש ובכתב בפרטי ההזמנה.
20. אישור הצדדים וחתימות
הצדדים מאשרים כי קראו את פרטי ההזמנה ואת סעיפי ההסכם, כי ניתנה להם אפשרות לשאול שאלות ולבקש הבהרות, וכי הם מסכימים לפרטים שסומנו ומולאו במסמך זה.`;

function localDateISO(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function parseLocalDate(value){const [y,m,d]=String(value||'').split('-').map(Number);return y&&m&&d?new Date(y,m-1,d):null}
function today(){return localDateISO(new Date())}
function sumPayments(e){return (e.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0)}
function totalDue(e){return Math.max(0,(Number(e.price)||0)-(Number(e.discount)||0)-sumPayments(e))}
function getEvent(id){return db.events.find(e=>e.id===id)}

function uniqueClientGroups(){
 const map=new Map();
 db.events.forEach(e=>{
  const phone=String(e.clientPhone||'').replace(/\D/g,'');
  const name=String(e.clientName||'').trim();
  const key=phone?`phone:${phone}`:`name:${name.toLowerCase()}`;
  if(!name&&!phone)return;
  if(!map.has(key))map.set(key,{key,name:name||'לקוח ללא שם',phone:e.clientPhone||'',email:e.clientEmail||'',events:[]});
  const g=map.get(key);g.events.push(e);if(!g.name&&name)g.name=name;if(!g.phone&&e.clientPhone)g.phone=e.clientPhone;if(!g.email&&e.clientEmail)g.email=e.clientEmail;
 });
 return [...map.values()].map(g=>{g.events.sort((a,b)=>(a.date||'').localeCompare(b.date||''));g.upcoming=g.events.find(e=>e.date&&e.date>=today())||g.events[g.events.length-1]||null;return g}).sort((a,b)=>a.name.localeCompare(b.name,'he'));
}

 const stats=`<div class="calendar-summary"><div class="stat"><div class="label">אירועים במערכת</div><div class="value">${db.events.length}</div><div class="hint">כל האירועים שנרשמו</div></div><div class="stat"><div class="label">לקוחות</div><div class="value">${clients.length}</div><div class="hint">לפי מספר טלפון או שם</div></div><div class="stat"><div class="label">אירועים בחודש הנבחר</div><div class="value">${db.events.filter(e=>(e.date||'').startsWith(`${calendarCursor.getFullYear()}-${String(calendarCursor.getMonth()+1).padStart(2,'0')}`)).length}</div><div class="hint">בחודש ${monthLabel}</div></div></div>`;

  }

function resourcesPage(){return `<div class="module-grid"><div class="panel"><div class="panel-head"><h3>הוספת איש צוות</h3><span class="pill blue">${db.staff.length} אנשי צוות</span></div><form id="staffForm" class="inline-form"><div><label>שם *</label><input name="name" required maxlength="100"></div><div><label>תפקיד</label><input name="role" maxlength="100" placeholder="צלם סטילס / וידאו / עורך"></div><div><label>טלפון</label><input name="phone" type="tel"></div><div><label>עלות לאירוע (₪)</label><input name="costPerEvent" type="number" min="0" step="1"></div><div class="wide"><button class="btn primary" type="submit">＋ הוספת איש צוות</button></div></form><div class="resource-list" style="margin-top:12px">${db.staff.length?db.staff.map(x=>`<div class="resource-item"><div class="resource-main"><strong>${esc(x.name)} ${x.active===false?'<span class="pill">לא פעיל</span>':''}</strong><small>${esc(x.role||'תפקיד לא צוין')} · ${esc(x.phone||'ללא טלפון')} · עלות: ${money(x.costPerEvent||0)}</small></div><div class="resource-controls"><button class="btn small" data-staff-toggle="${x.id}">${x.active===false?'הפעלה':'השבתה'}</button><button class="btn small danger" data-staff-delete="${x.id}">מחיקה</button></div></div>`).join(''):'<div class="empty">עדיין לא הוגדר צוות.</div>'}</div></div><div class="panel"><div class="panel-head"><h3>הוספת ציוד</h3><span class="pill blue">${db.equipment.length} פריטי ציוד</span></div><form id="equipmentForm" class="inline-form"><div><label>שם הציוד *</label><input name="name" required maxlength="100" placeholder="Nikon Z8 / פלאש / רחפן"></div><div><label>קטגוריה</label><select name="category"><option>מצלמה</option><option>עדשה</option><option>תאורה</option><option>רחפן</option><option>מחשב ועריכה</option><option>מדפסת</option><option>אחר</option></select></div><div><label>מספר סידורי / מזהה</label><input name="serial" maxlength="100"></div><div><label>סטטוס</label><select name="status"><option value="available">זמין</option><option value="maintenance">בתיקון</option><option value="reserved">משויך לאירוע</option></select></div><div class="wide"><label>הערות</label><input name="note" maxlength="200"></div><div class="wide"><button class="btn primary" type="submit">＋ הוספת ציוד</button></div></form><div class="resource-list" style="margin-top:12px">${db.equipment.length?db.equipment.map(x=>`<div class="resource-item"><div class="resource-main"><strong>${esc(x.name)}</strong><small>${esc(x.category||'ציוד')} · ${esc(x.serial||'ללא מזהה')} · ${({available:'זמין',maintenance:'בתיקון',reserved:'משויך לאירוע'})[x.status]||x.status||'זמין'} · ${esc(x.note||'')}</small></div><div class="resource-controls"><button class="btn small danger" data-equipment-delete="${x.id}">מחיקה</button></div></div>`).join(''):'<div class="empty">עדיין לא הוזן ציוד.</div>'}</div></div></div><div class="alert" style="margin-top:14px">אפשר לשייך אנשי צוות למשימות ולראות עלויות לאירוע. רישום ציוד כאן הוא מלאי בסיסי; אין עדיין שליטה ישירה במצלמות או בדיקת חיבור USB.</div>`}
function assistantPage(){const insights=[];const upcoming=db.events.filter(e=>e.date&&e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));db.events.filter(e=>!e.contract?.signed&&e.date&&e.date>=today()).forEach(e=>insights.push({level:'גבוה',title:`החוזה של ${e.clientName} עדיין לא חתום`,detail:`אירוע ${dateFmt(e.date)} · כדאי לבדוק אם ההצעה אושרה.`}));db.events.filter(e=>totalDue(e)>0&&e.date&&e.date>=today()).forEach(e=>insights.push({level:'בינוני',title:`נותרה יתרה לתשלום אצל ${e.clientName}`,detail:`יתרה של ${money(totalDue(e))} · מומלץ לתאם את מועד הגבייה.`}));db.tasks.filter(t=>!['done','cancelled'].includes(t.status)&&t.enabled!==false&&t.dueDate&&t.dueDate<today()).forEach(t=>insights.push({level:'גבוה',title:`משימה באיחור: ${t.title}`,detail:`מועד ביצוע: ${dateFmt(t.dueDate)} · ${getEvent(t.eventId)?.clientName||'משימה כללית'}`}));db.leads.filter(l=>['new','contacted'].includes(l.status)).forEach(l=>insights.push({level:'בינוני',title:`פנייה ממתינה לטיפול: ${l.name}`,detail:`מקור ${({website:'אתר',facebook:'Facebook',instagram:'Instagram',manual:'ידני'})[l.source]||l.source} · מעקב: ${dateFmt(l.followUpDate)}`}));db.events.filter(e=>e.date&&e.date>=today()&&(!e.venue||!e.time)).forEach(e=>insights.push({level:'נמוך',title:`חסרים פרטים לאירוע של ${e.clientName}`,detail:`${!e.venue?'לא הוזן אולם. ':''}${!e.time?'לא הוזנה שעת צילום.':''}`}));if(!insights.length)insights.push({level:'טוב',title:'לא נמצאו נושאים דחופים',detail:'לפי הנתונים שהוזנו כרגע, אין המלצות פתוחות. המשך לעדכן את המערכת.'});return `<div class="panel"><div class="panel-head"><div><h3>עוזר ניהולי – תמונת מצב והמלצות</h3><div class="small-muted">קריאה בלבד. העוזר אינו משנה נתונים ואינו שולח הודעות או מבצע פעולות.</div></div><span class="pill gold">מצב המלצות</span></div><div class="alert">כרגע ההמלצות מחושבות מתוך הנתונים המקומיים והכללים העסקיים במערכת. חיבור למודל AI חיצוני ידרוש מפתח API והגדרה מאובטחת בשרת; הוא אינו פעיל בחבילה זו.</div><div class="task-list">${insights.map(x=>`<div class="recommendation"><strong>${esc(x.title)} <span class="reminder-pill">עדיפות ${esc(x.level)}</span></strong>${esc(x.detail)}</div>`).join('')}</div><div class="footer-note">ההמלצות אינן מבצעות שינוי. כל פעולה עתידית דרך העוזר תדרוש אישור מפורש לפני ביצוע, בהתאם להגדרה שאישרת.</div></div><div class="module-grid" style="margin-top:15px"><div class="module-card"><h3>אירועים קרובים</h3>${upcoming.slice(0,5).map(e=>`<p class="small-muted">${dateFmt(e.date)} · ${esc(e.clientName)} · ${money(totalDue(e))} יתרה</p>`).join('')||'<p class="muted">אין אירועים עתידיים.</p>'}</div><div class="module-card"><h3>משימות פעילות</h3><p>${db.tasks.filter(t=>!['done','cancelled'].includes(t.status)&&t.enabled!==false).length} משימות פתוחות</p><p>${db.tasks.filter(t=>!['done','cancelled'].includes(t.status)&&t.dueDate&&t.dueDate<today()).length} משימות באיחור</p><button class="btn small" data-nav="tasks">מעבר למשימות</button></div></div>`}
function saveTaskFromForm(ev){ev.preventDefault();const d=Object.fromEntries(new FormData(ev.currentTarget));db.tasks.push({id:makeId(),title:d.title.trim(),dueDate:d.dueDate||'',eventId:d.eventId||'',assignee:d.assignee||'',reminderEnabled:!!ev.currentTarget.elements.reminderEnabled?.checked,enabled:true,status:'pending',createdAt:today()});saveDB();render();toast('המשימה נשמרה')}
function saveLeadFromForm(ev){ev.preventDefault();const d=Object.fromEntries(new FormData(ev.currentTarget));db.leads.push({id:makeId(),name:d.name.trim(),phone:d.phone||'',email:d.email||'',source:d.source||'manual',type:d.type||'other',date:d.date||'',followUpDate:d.followUpDate||'',budget:Number(d.budget)||0,notes:d.notes||'',status:'new',createdAt:new Date().toISOString()});saveDB();render();toast('הפנייה נשמרה')}
function saveExpenseFromForm(ev){ev.preventDefault();const d=Object.fromEntries(new FormData(ev.currentTarget));db.expenses.push({id:makeId(),description:d.description.trim(),amount:Number(d.amount)||0,date:d.date||today(),category:d.category||'אחר',eventId:d.eventId||'',note:d.note||''});saveDB();render();toast('ההוצאה נשמרה')}
function convertLead(id){const l=db.leads.find(x=>x.id===id);if(!l)return;const e={id:makeId(),createdAt:today(),payments:[],milestones:{},contract:{},clientName:l.name,clientPhone:l.phone,clientEmail:l.email,type:l.type||'other',date:l.date||'',time:'',venue:'',venueAddress:'',packageId:'',packageName:'',price:Number(l.budget)||0,discount:0,deliveryDate:'',packageDetails:'',notes:`נוצרה מפנייה ${l.source||'ידנית'}. ${l.notes||''}`};db.events.push(e);db.tasks.push(...defaultEventTasks(e));l.status='won';l.convertedEventId=e.id;saveDB();openEvent(e.id,'details')}
function requestBrowserNotifications(){if(!('Notification'in window)){alert('הדפדפן הזה אינו תומך בהתראות.');return}Notification.requestPermission().then(p=>{db.reminderSettings.notificationsEnabled=p==='granted';saveDB();toast(p==='granted'?'התראות הדפדפן הופעלו':'לא ניתנה הרשאה להתראות');render()})}
function packageCard(p){const lines=(p.details||'').split(/\r?\n/).map(x=>x.replace(/^\s*[•*-]\s*/, '').trim()).filter(Boolean);const benefits=lines.slice(0,6).map(x=>`<li>${esc(x)}</li>`).join('');const img=p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:`<div class="package-placeholder"><span>📸</span><strong>צילום ברמה אחרת</strong></div>`;const placement=['top','bottom','right','left'].includes(p.imagePlacement)?p.imagePlacement:'top';const fit=p.imageFit==='contain'?'contain':'cover';const pos=['center center','center top','center bottom','right center','left center'].includes(p.imagePosition)?p.imagePosition:'center center';const align=['right','center','left'].includes(p.textAlign)?p.textAlign:'right';const size=['normal','wide','full'].includes(p.cardSize)?p.cardSize:'normal';const badgePos={'top-right':'top:13px;right:13px','top-left':'top:13px;left:13px','bottom-right':'bottom:13px;right:13px','bottom-left':'bottom:13px;left:13px'}[p.badgePosition]||'top:13px;right:13px';const h=Math.max(140,Math.min(420,Number(p.imageHeight)||260));return `<article class="package-card" data-package-card data-package-id="${esc(p.id)}" data-image-placement="${placement}" data-card-size="${size}" style="--package-photo-height:${h}px;--package-photo-fit:${fit};--package-photo-position:${pos};--package-text-align:${align}" data-type="${esc(p.type)}" data-search="${esc([p.name,p.description,p.details,typeLabel(p.type),p.badge].join(' ').toLowerCase())}"><div class="package-hero">${img}${p.badge?`<span class="package-badge" style="${badgePos}">${esc(p.badge)}</span>`:''}${!p.active?'<span class="package-status">מוסתרת</span>':''}<button type="button" class="package-drag-handle" draggable="true" data-package-drag-handle="${esc(p.id)}" title="גרור כדי לשנות את סדר החבילות">⠿ גרירה</button></div><div class="package-content"><div class="package-kicker">${esc(typeLabel(p.type))}</div><h3 class="package-title">${esc(p.name)}</h3><p class="package-description">${esc(p.description||'')}</p><ul class="package-benefits">${benefits||'<li>עדיין לא הוזנו פרטי החבילה</li>'}</ul><div class="package-price-row"><div><div class="small-muted">מחיר החבילה</div><div class="package-price">${Number(p.price)>0?money(p.price):'לפי הצעה'} <small>${Number(p.price)>0?'':' '}</small></div></div><span class="pill ${p.active?'green':''}">${p.active?'פעילה':'מוסתרת'}</span></div><div class="package-quick-price"><label for="package-price-${esc(p.id)}">שינוי מחיר מהיר (₪)</label><div class="package-quick-row"><input id="package-price-${esc(p.id)}" type="number" min="0" step="1" value="${Number(p.price)||0}" data-package-price-input="${esc(p.id)}" aria-label="מחיר חדש לחבילה ${esc(p.name)}"><button class="btn small gold" data-save-package-price="${esc(p.id)}">עדכון מחיר</button></div></div><div class="package-actions"><button class="btn small" data-move-package="${esc(p.id)}" data-direction="up" title="העבר למעלה">↑ למעלה</button><button class="btn small" data-move-package="${esc(p.id)}" data-direction="down" title="העבר למטה">↓ למטה</button><button class="btn small primary" data-edit-package="${esc(p.id)}">עריכה</button><button class="btn small" data-copy-package="${esc(p.id)}">העתקה ועריכה</button><button class="btn small" data-toggle-package="${esc(p.id)}">${p.active?'הסתרה':'הפעלה'}</button><button class="btn small danger" data-delete-package="${esc(p.id)}">מחיקה</button></div></div></article>`}
function builderOptionsAdminMarkup(){const rows=(db.builderOptions||[]).map(o=>`<tr data-builder-row="${esc(o.id)}"><td><input data-builder-name="${esc(o.id)}" value="${esc(o.name)}" aria-label="שם השירות"></td><td><input data-builder-category="${esc(o.id)}" value="${esc(o.category)}" aria-label="קטגוריה"></td><td><select data-builder-type="${esc(o.id)}" aria-label="אופן הבחירה"><option value="quantity" ${o.selectionType!=='yesno'?'selected':''}>בחירת כמות</option><option value="yesno" ${o.selectionType==='yesno'?'selected':''}>כן / לא (✓)</option></select></td><td><input data-builder-unit="${esc(o.id)}" value="${esc(o.unit)}" aria-label="יחידת בחירה"></td><td><label class="builder-active"><input type="checkbox" data-builder-active="${esc(o.id)}" ${o.active!==false?'checked':''}> פעיל ללקוחות</label></td><td><button type="button" class="btn danger small" data-delete-builder-option="${esc(o.id)}">מחיקה</button></td></tr>`).join('');return `<section class="panel builder-admin-panel"><div class="panel-head"><div><h3>בנייה עצמית – קטלוג שירותים לבחירת הלקוח</h3><div class="small-muted">כאן מנהלים את רשימת השירותים והאפשרויות שהלקוח יוכל לסמן. הלקוח לא רואה מחירים ולא מתמחר את החבילה.</div></div><span class="pill gold">קטלוג בחירה</span></div><div class="builder-admin-table-wrap"><table class="builder-admin-table"><thead><tr><th>שירות / מוצר</th><th>קטגוריה</th><th>אופן הבחירה</th><th>יחידת בחירה</th><th>זמין ללקוח</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6">אין שירותים בקטלוג עדיין.</td></tr>'}</tbody></table></div><div class="toolbar" style="margin-top:12px"><button class="btn" type="button" id="addBuilderOption">＋ הוספת שירות</button><button class="btn primary" type="button" id="saveBuilderOptions">שמירת קטלוג השירותים</button></div><div class="footer-note">בעמודה "אופן הבחירה" קובעים לכל שירות אם הלקוח בוחר כמות או מסמן ✓ (כן/לא). הלקוח מסמן ושולח אליך בקשה. הבחירה מגיעה לכרטיס האירוע, ואתה קובע את המחיר ושולח הצעת מחיר אישית. שינוי הקטלוג לא משנה הצעות וחוזים שכבר נשלחו.</div></section>`}
function packagesPage(){const packages=db.packages.slice().sort((a,b)=>(Number(a.sortOrder)||0)-(Number(b.sortOrder)||0));return `${builderOptionsAdminMarkup()}<div class="package-intro"><div><div class="eyebrow" style="color:#d7b66e">החבילות של העסק</div><h3>בחרו חבילה, בנו אותה בדיוק בשביל הלקוחות שלכם</h3><p>כאן מנהלים את המחירון הפנימי: תמונה, מחיר ורשימת השירותים בכל חבילה. בעת בחירה באירוע, רק שם החבילה ומפרט השירותים יועתקו לסעיף השירותים בחוזה. תנאי החוזה והסעיפים המשפטיים מנוהלים בנפרד.</p></div><button class="btn gold" id="addPackageTop">＋ הוספת חבילה חדשה</button></div><div class="package-filterbar"><input class="search" id="packageSearch" placeholder="חיפוש לפי שם או תיאור..."><select class="search" id="packageTypeFilter"><option value="">כל סוגי האירועים</option>${Object.entries(TYPE_NAMES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><span class="pill blue">${db.packages.filter(p=>p.active).length} חבילות פעילות</span><span class="small-muted">סדר חבילות: גרור את כפתור ⠿ או השתמש בחצי למעלה/למטה</span></div><div class="package-grid" id="packageGrid">${packages.length?packages.map(packageCard).join(''):'<div class="empty" style="grid-column:1/-1">עדיין אין חבילות. לחץ על „הוספת חבילה חדשה” כדי ליצור את הראשונה.</div>'}</div><div class="footer-note">טיפ: אפשר ליצור כמה חבילות לאותו אירוע – למשל בסיס, סטנדרט ו-VIP. שינוי מחיר או מפרט במאגר לא משנה אירועים או חוזים שכבר נשמרו. החבילה היא מחירון ומפרט שירותים בלבד; החוזה המלא נוצר בנפרד בעת הכנת המסמך ללקוח.</div>`}

 document.querySelectorAll('[data-client-toggle]').forEach(b=>b.addEventListener('click',()=>{const el=document.getElementById('client-history-'+b.dataset.clientToggle);if(el){el.classList.toggle('hidden');b.textContent=el.classList.contains('hidden')?'היסטוריה':'הסתרת היסטוריה'}}));

electionType==='yesno'?`${x.name} – ✓`:`${x.name} – ${x.quantity} ${x.unit}`).join('\n'):e.quoteSelection.items)}`:''}${e.quoteSelection.clientNote?`\n\nהערות הלקוח: ${esc(e.quoteSelection.clientNote)}`:''}${e.quoteSelection.requestedAt?`\n\nמועד קבלה: ${new Date(e.quoteSelection.requestedAt).toLocaleString('he-IL')}`:''}</textarea><span class="help">זו בחירת עניין/הצעת מחיר בלבד. עדיין לא נוצר חוזה ולא אושר מחיר.</span></div>`:''}${e?.customPackageRequest?`<div class="field wide"><label>בקשת חבילה בהתאמה אישית שהתקבלה מהלקוח</label><textarea readonly style="min-height:150px;background:#faf8f2;border-color:#e8dcc0">${esc(e.customPackageRequest.details||'')}${e.customPackageRequest.extraRequests?'\n\nשירות נוסף / בקשה מיוחדת: '+e.customPackageRequest.extraRequests:''}${e.customPackageRequest.clientNote?'\n\nהערת הלקוח: '+e.customPackageRequest.clientNote:''}${e.customPackageRequest.requestedAt?'\n\nמועד קבלת הבקשה: '+new Date(e.customPackageRequest.requestedAt).toLocaleString('he-IL'):''}</textarea><div class="toolbar" style="margin-top:8px"><button class="btn small" type="button" id="copyCustomRequestToPackage">העתקת בחירת הלקוח למפרט החבילה</button></div><span class="help">הבקשה אינה חוזה או הצעת מחיר מחייבת. אפשר להעתיק את הבחירה למפרט, לקבוע מחיר בשדות ההזמנה ולשלוח הצעת מחיר סופית.</span></div>`:''}</div><div class="balance-box" id="eventBalance"><div><span>סה״כ לאחר הנחה</span><strong id="eventNetTotal">${money((Number(e?.price)||0)-(Number(e?.discount)||0))}</strong></div><div><span>שולם</span><strong id="eventPaidTotal">${money(sumPayments(e||{payments:[]}))}</strong></div><div><span>יתרה</span><strong id="eventDueTotal">${money(totalDue(e||{price:0,discount:0,payments:[]}))}</strong></div></div><div class="modal-actions"><span class="small-muted">${e?`נוצר בתאריך ${dateFmt(e.createdAt||'')}`:'לאחר שמירה ייפתחו אזורי התשלומים, החוזה והמעקב'}</span><div style="display:flex;gap:8px;flex-wrap:wrap">${e?'<button class="btn danger" type="button" id="deleteEvent">מ function contractTab(e){if(!e)return '';const c=e.contract||{},terms=c.terms??db.terms;return `<div class="alert"><strong>החוזה הוא מסמך נפרד מהחבילה.</strong> החבילה מספקת רק את רשימת השירותים והמחיר. כאן משלימים את פרטי ההתקשרות, תנאי התשלום, זמני המסירה, סעיפי ההסכם ואישור הפרסום. בהפקה נפתח מסמך חוזה מלא בחלון נפרד. בחר בחלון ההדפסה של Chrome באפשרות "שמירה כ-PDF" ושמור את הקובץ. לאחר מכן אפשר לצרף את ה-PDF בשיחת WhatsApp Business דרך + / מהדק ואז "מסמך".</div><div class="section-title">פרטי החוזה</div><div class="form-grid"><div class="field"><label>מספר חוזה</label><input value="${esc(c.number||`SM-${String(e.id).slice(-6)}`)}" disabled></div><div class="field"><label>סטטוס חוזה</label><select id="contractStatus"><option value="draft" ${!c.sent&&!c.signed?'selected':''}>טיוטה</option><option value="sent" ${c.sent&&!c.signed?'selected':''}>נשלח ללקוח</option><option value="signed" ${c.signed?'selected':''}>נחתם</option></select></div><div class="field"><label>שעת סיום צילום (אם סוכמה)</label><input id="contractEndTime" type="time" value="${esc(c.endTime||'')}"></div><div class="field"><label>תעריף לשעת צילום נוספת (₪)</label><input id="contractExtraHourRate" type="number" min="0" step="1" value="${esc(c.extraHourRate??'')}"></div><div class="field"><label>האם המחיר כולל מע״מ?</label><select id="contractVatStatus"><option value="included" ${(c.vatStatus||'included')==='included'?'selected':''}>המחיר כולל מע״מ</option><option value="excluded" ${c.vatStatus==='excluded'?'selected':''}>המחיר לפני מע״מ</option><option value="notapplicable" ${c.vatStatus==='notapplicable'?'selected':''}>לא חל מע״מ / לא רלוונטי</option><option value="unspecified" ${c.vatStatus==='unspecified'?'selected':''}>לא הוגדר – להשלים</option></select></div></div><h4 class="section-title">מועדי מסירה שסוכמו עם הלקוח</h4><div class="form-grid"><div class="field"><label>תמונות – ימי עסקים לאחר בחירת התמונות</label><input id="contractPhotoDays" type="number" min="0" step="1" placeholder="לדוגמה: 2 <script>

function printContractDoc(e){
  let docHtml;
  try{docHtml=buildContractPrintDocument(e)}catch(err){console.error('Contract print validation failed:',err);alert(err.message||'לא ניתן להפיק חוזה כי חסרים פרטים.');return null}
  /* Open synchronously from the user's click so Chrome does not block the print window. */
  const win=window.open('about:blank','_blank');
  if(!win){alert('Chrome חסם חלון חדש. אפשר חלונות קופצים לאפליקציה ונסה שוב.');return null}
  try{win.document.open();win.document.write(docHtml);win.document.close();return win}
  catch(err){console.error('Contract window failed:',err);try{win.close()}catch(_){}alert('לא הצלחתי לפתוח את חלון החוזה. נסה שוב.');return null}
}
function downloadContractPdf(e){
  const win=printContractDoc(e);
  if(win)toast('החוזה נפתח בחלון הדפסה. בחר יעד "שמירה כ-PDF" ושמור את הקובץ.');
  return !!win;
}
function phoneForWhatsApp(raw){let n=String(raw||'').replace(/\D/g,'');if(n.startsWith('0'))n='972'+n.slice(1);return n}
function openWhatsApp(phone,message){const n=phoneForWhatsApp(phone);if(!n){alert('לא הוזן מספר טלפון תקין ללקוח.');return}showWhatsAppChooser(n,message)}
function showWhatsAppChooser(phone,message,shareOptions={}){closeWhatsAppChooser();const pdfNote=shareOptions.requiresPdfSave?`<div class="alert" style="margin-top:12px"><strong>לפני השליחה יש לשמור את החוזה כ-PDF:</strong><br>בחלון החוזה שנפתח, בחר "שמירה כ-PDF" ושמור בתיקיית ההורדות. לאחר מכן, בשיחת WhatsApp Business לחץ על + או על המהדק, בחר "מסמך" וצרף את הקובץ ששמרת. ההודעה לבדה אינה כוללת את הקובץ.</div>`:'';const overlay=document.createElement('div');overlay.id='waChooserBackdrop';overlay.className='modal-backdrop show';overlay.style.zIndex='40';overlay.innerHTML=`<div class="modal wa-chooser" role="dialog" aria-modal="true" aria-label="בחירת WhatsApp"><div class="modal-head"><h3>איך לשלוח את ההודעה?</h3><button class="close" type="button" id="closeWaChooser" aria-label="סגירה">×</button></div><div class="modal-body"><p>בחר באיזו גרסת WhatsApp לפתוח את ההודעה ללקוח.</p>${pdfNote}<div class="wa-choice-list"><button class="btn primary" type="button" data-wa-choice="business">WhatsApp Business</button><button class="btn" type="button" data-wa-choice="regular">WhatsApp רגיל</button><button class="btn" type="button" data-wa-choice="web">WhatsApp Web</button><button class="btn" type="button" data-wa-choice="copy">העתקת נוסח ההודעה</button></div><div class="wa-note">באנדרואיד, בחירת WhatsApp Business מנסה לפתוח ישירות את אפליקציית Business. במחשב וב-iPhone אין לדפדפן דרך אמינה לכפות בחירה בין שתי אפליקציות WhatsApp; במצב כזה אפשר להעתיק את ההודעה, לפתוח ידנית את WhatsApp Business ולהדביק אותה. את קובץ ה-PDF יש לצרף בנפרד בתוך השיחה.</div></div></div>`;document.body.appendChild(overlay);overlay.querySelector('#closeWaChooser').addEventListener('click',closeWhatsAppChooser);overlay.addEventListener('click',e=>{if(e.target===overlay)closeWhatsAppChooser()});overlay.querySelectorAll('[data-wa-choice]').forEach(btn=>btn.addEventListener('click',()=>{const choice=btn.dataset.waChoice;closeWhatsAppChooser();launchWhatsAppChoice(choice,phone,message,shareOptions)}))}
function closeWhatsAppChooser(){const el=document.getElementById('waChooserBackdrop');if(el)el.remove()}
function launchWhatsAppChoice(choice,phone,message,shareOptions={}){const text=encodeURIComponent(message),webUrl=`https://web.whatsapp.com/send?phone=${phone}&text=${text}`,regularUrl=`https://wa.me/${phone}?text=${text}`;if(choice==='copy'){copyWhatsAppText(message);return}if(choice==='business'){if(/Android/i.test(navigator.userAgent)){const intent=`intent://send?phone=${phone}&text=${text}#Intent;scheme=whatsapp;package=com.whatsapp.w4b;end`;window.location.href=intent;toast('נפתח ניסיון לפתוח את WhatsApp Business. יש לצרף לשיחה את ה-PDF ששמרת.')}else{copyWhatsAppText(message).then(()=>alert('ההודעה הועתקה. פתח את WhatsApp Business, בחר את הלקוח והדבק את ההודעה. צרף את קובץ ה-PDF ששמרת באמצעות + / מהדק ואז מסמך.'))}return}const url=choice==='web'?webUrl:regularUrl;const win=window.open(url,'_blank','noopener');if(!win)window.location.href=url;if(shareOptions.requiresPdfSave)setTimeout(()=>alert('זכור לצרף את קובץ ה-PDF ששמרת: בשיחת WhatsApp לחץ על + / מהדק, בחר מסמך ובחר את החוזה.'),450)}
async function copyWhatsAppText(message){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(message)}else{const area=document.createElement('textarea');area.value=message;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}toast('נוסח ההודעה הועתק ללוח')}catch(e){alert('לא ניתן להעתיק אוטומטית. אפשר לסמן ולהעתיק את נוסח ההודעה מתוך תיבת ההודעה.')}}
function onlineConfig(){const c=db.cloud||{};return {baseUrl:String(c.baseUrl||'').trim().replace(/\/$/,''),adminKey:String(c.adminKey||'').trim()}}
function calendarConfig(){const c=db.cloud||{};return {baseUrl:String(c.baseUrl||'').trim().replace(/\/$/,''),adminKey:String(c.adminKey||'').trim()}}
async function refreshGoogleCalendarStatus(){const cfg=calendarConfig(),el=document.getElementById('googleCalendarStatus');if(!el)return;if(!cfg.baseUrl||!cfg.adminKey){el.innerHTML='<span class="google-calendar-dot"></span><span class="small-muted">יש לשמור תחילה כתובת HTTPS ומפתח מנהל בהגדרות החיבור המקוון.</span>';return}el.innerHTML='<span class="google-calendar-dot"></span><span class="small-muted">בודק חיבור ליומן Google…</span>';try{const r=await fetch(cfg.baseUrl+'/api/admin/google-calendar/status',{headers:{'X-Admin-Key':cfg.adminKey,'Accept':'application/json'}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'HTTP '+r.status);if(j.connected){el.innerHTML=`<span class="google-calendar-dot on"></span><strong>מחובר${j.email?' לחשבון '+esc(j.email):''}</strong><span class="pill green">סנכרון זמין</span>`}else if(!j.configured){el.innerHTML='<span class="google-calendar-dot"></span><span class="small-muted">השרת מחובר, אך חסרים פרטי Google OAuth בשרת. יש להשלים את הגדרת Google Cloud לפי מדריך ההתקנה.</span>'}else{el.innerHTML='<span class="google-calendar-dot"></span><span class="small-muted">פרטי OAuth הוגדרו. לחץ על התחברות ל-Google Calendar כדי לאשר גישה.</span>'}}catch(e){el.innerHTML=`<span class="google-calendar-dot"></span><span class="small-muted">לא ניתן לבדוק חיבור: ${esc(e.message)}</span>`}}
async function connectGoogleCalendar(){const cfg=calendarConfig();if(!cfg.baseUrl||!cfg.adminKey){alert('שמור תחילה כתובת HTTPS ומפתח מנהל בהגדרות החיבור המקוון.');return}const b=document.getElementById('connectGoogleCalendar');if(b){b.disabled=true;b.textContent='מכין חיבור…'}try{const r=await fetch(cfg.baseUrl+'/api/admin/google-calendar/connect',{method:'POST',headers:{'X-Admin-Key':cfg.adminKey,'Accept':'application/json'}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'HTTP '+r.status);if(!j.authorizationUrl)throw new Error('לא התקבל קישור הרשאה מ-Google');window.location.href=j.authorizationUrl}catch(e){alert('לא ניתן להתחיל חיבור ל-Google Calendar: '+e.message)}finally{if(b){b.disabled=false;b.textContent='התחברות ל-Google Calendar'}}}
async function disconnectGoogleCalendar(){const cfg=calendarConfig();if(!cfg.baseUrl||!cfg.adminKey)return;if(!confirm('לנתק את Google Calendar מהמערכת? אירועים שכבר נוצרו ביומן לא יימחקו.'))return;try{const r=await fetch(cfg.baseUrl+'/api/admin/google-calendar',{method:'DELETE',headers:{'X-Admin-Key':cfg.adminKey}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'שגיאת שרת');toast('חיבור Google Calendar נותק');refreshGoogleCalendarStatus()}catch(e){alert('לא ניתן לנתק כרגע: '+e.message)}}
async function syncExistingGoogleCalendarEvents(){const events=db.events.filter(e=>e.date);if(!events.length){alert('אין אירועים עם תאריך לסנכרון.');return}if(!confirm(`לסנכרן עכשיו ${events.length} אירועים קיימים ליומן Google? אירועים שכבר סונכרנו יעודכנו ולא יוכפלו.`))return;const b=document.getElementById('syncExistingGoogleCalendar');if(b){b.disabled=true;b.textContent='מסנכרן…'}let ok=0,fail=0;for(const e of events){if(await syncEventToGoogleCalendar(e,true))ok++;else fail++}if(b){b.disabled=false;b.textContent='סנכרון אירועים קיימים'}alert(`הסנכרון הסתיים. הצליחו: ${ok}. לא סונכרנו: ${fail}.`)}

let appPasswordSet=null,lastCloudCheck=0,deferredInstallPrompt=null;
function isSessionLogin(){return String(db.cloud?.adminKey||'').startsWith('sess_')}
function onServerOrigin(){return location.protocol==='https:'||location.protocol==='http:'}
function writeLocalOnly(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}catch(e){console.error(e)}}
function isLocalDirty(){const a=db.meta?.lastSavedAt||'',b=db.meta?.lastCloudSync||'';return !!a&&a>b}
function modalOpen(){return document.getElementById('modalBackdrop')?.classList.contains('show')}
function appLoginPanel(){
  const status=appPasswordSet===null?'בודק…':(appPasswordSet?'סיסמה מוגדרת':'לא הוגדרה סיסמה');
  const session=isSessionLogin();
  return `<div class="panel app-login-panel"><div class="panel-head"><div><h3>כניסה עם סיסמה – מחשב וטלפון</h3><div class="small-muted">הגדירו סיסמה אישית, ותוכלו להיכנס למערכת מכל מכשיר. הנתונים נשמרים בשרת ומסתנכרנים אוטומטית בין המחשב לטלפון.</div></div><span class="pill ${appPasswordSet?'green':'gold'}" id="appLoginStatus">${status}</span></div>
  <div class="form-grid"><div class="field"><label for="appNewPassword">${appPasswordSet?'סיסמה חדשה':'סיסמה'}</label><input id="appNewPassword" type="password" autocomplete="new-password" placeholder="לפחות 6 תווים"></div><div class="field"><label for="appNewPassword2">אימות סיסמה</label><input id="appNewPassword2" type="password" autocomplete="new-password" placeholder="הקלידו שוב את הסיסמה"></div></div>
  <div class="toolbar" style="margin-top:12px"><button class="btn primary" id="setAppPassword">${appPasswordSet?'החלפת סיסמה':'שמירת סיסמה'}</button><button class="btn" id="installAppBtn">📱 התקנה כאפליקציה</button>${session?'<button class="btn" id="logoutDevice">התנתקות מהמכשיר הזה</button>':''}${appPasswordSet?'<button class="btn" id="logoutAllDevices">ניתוק כל המכשירים</button>':''}</div>
  <div class="footer-note">בטלפון: פותחים את <strong>${esc(location.host||'manage.ofirphoto.com')}</strong>, נכנסים עם הסיסמה, ואז באנדרואיד (Chrome) בוחרים ⋮ ← "הוספה למסך הבית", ובאייפון (Safari) לוחצים על כפתור השיתוף ← "הוספה למסך הבית". החלפת הסיסמה מנתקת את כל המכשירים שנכנסו עם הסיסמה הקודמת.</div></div>`;
}
async function refreshAppPasswordStatus(){if(!onServerOrigin())return;try{const r=await fetch('/api/auth/status',{cache:'no-store'});const j=await r.json();const changed=appPasswordSet!==!!j.passwordSet;appPasswordSet=!!j.passwordSet;if(changed&&currentPage==='settings'&&!modalOpen())render();return appPasswordSet}catch(e){return null}}
function showLoginScreen(message){
  if(document.getElementById('loginGate'))return;
  if(isSessionLogin()){db.cloud.adminKey='';writeLocalOnly()}
  const gate=document.createElement('div');gate.id='loginGate';
  gate.style.cssText='position:fixed;inset:0;z-index:9999;background:#111318;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;direction:rtl';
  gate.innerHTML=`<form id="loginForm" style="width:100%;max-width:360px;text-align:center"><div style="font-size:42px;color:#c6a45b;margin-bottom:6px">✦</div><h2 style="margin:0 0 4px;font-size:22px">${esc(db.business?.name||'Studio Manager')}</h2><div style="color:#9aa0aa;font-size:14px;margin-bottom:22px">כניסה למערכת הניהול</div>${message?`<div style="background:#2a2d33;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:#ead9ae">${esc(message)}</div>`:''}<input id="loginPassword" type="password" autocomplete="current-password" placeholder="סיסמה" required style="width:100%;padding:15px 16px;border-radius:12px;border:1px solid #3a3d44;background:#1b1d22;color:#fff;font-size:17px;text-align:center"><button type="submit" id="loginSubmit" style="width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:#c6a45b;color:#111318;font-weight:bold;font-size:17px">כניסה</button><div id="loginError" style="color:#ff8f8f;font-size:14px;min-height:20px;margin-top:12px"></div></form>`;
  document.body.appendChild(gate);
  const input=gate.querySelector('#loginPassword');setTimeout(()=>input.focus(),50);
  gate.querySelector('#loginForm').addEventListener('submit',async ev=>{ev.preventDefault();const btn=gate.querySelector('#loginSubmit'),err=gate.querySelector('#loginError');btn.disabled=true;btn.textContent='מתחבר…';err.textContent='';
    try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:input.value,deviceLabel:(navigator.userAgent||'').slice(0,80)})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'הכניסה נכשלה');
      db.cloud={...(db.cloud||{}),baseUrl:location.origin,adminKey:j.token,autoSync:true};db.meta={...(db.meta||{})};delete db.meta.serverRevision;writeLocalOnly();
      btn.textContent='טוען נתונים…';const pulled=await syncCloudNow('pull',true);
      if(!pulled&&isLocalDirty())await syncCloudNow('push',true);
      appPasswordSet=true;gate.remove();render();toast('ברוכים הבאים!')}
    catch(e){err.textContent=e.message;btn.disabled=false;btn.textContent='כניסה';input.select()}});
}
async function handleCloudConflict(){
  const ok=await syncCloudNow('pull',true);
  if(ok){if(!modalOpen())render();alert('הנתונים עודכנו ממכשיר אחר, ולכן נטענה הגרסה העדכנית. אם השינוי האחרון שלך לא מופיע – בצע אותו שוב.')}
}
async function backgroundCloudCheck(force=false){
  const base=cloudBase(),key=(db.cloud?.adminKey||'').trim();
  if(!base||!key||cloudSyncBusy||document.getElementById('loginGate'))return;
  if(!force&&Date.now()-lastCloudCheck<3000)return;lastCloudCheck=Date.now();
  try{const r=await fetch(base+'/api/admin/manager-db',{headers:{'X-Admin-Key':key},cache:'no-store'});const j=await r.json().catch(()=>({}));
    if(r.status===401&&key.startsWith('sess_')){showLoginScreen('פג תוקף הכניסה במכשיר הזה. היכנסו שוב עם הסיסמה.');return}
    if(!r.ok)return;
    if(!j.data){if(isLocalDirty()||db.events?.length)await syncCloudNow('push',true);return}
    const localRev=db.meta?.serverRevision||null,dirty=isLocalDirty();
    if(j.revision&&j.revision===localRev){if(dirty)await syncCloudNow('push',true);return}
    if(dirty&&!localRev){await syncCloudNow('push',true);return}
    if(dirty){await syncCloudNow('push',true);return}
    if(modalOpen())return;
    const localCloud={...(db.cloud||{})};db=normalizeDB(j.data);db.cloud={...db.cloud,...localCloud};db.meta={...(db.meta||{}),serverRevision:j.revision||null,lastCloudSync:new Date().toISOString()};writeLocalOnly();cloudLastStatus='עודכן מהענן';render();
  }catch(e){console.warn('Cloud check:',e.message)}
}
function flushPendingSync(){if(isLocalDirty()&&db.cloud?.adminKey&&cloudBase()){clearTimeout(cloudSyncTimer);cloudSyncTimer=null;syncCloudNow('push',true)}}
async function setAppPasswordFromForm(){
  const a=document.getElementById('appNewPassword')?.value||'',b=document.getElementById('appNewPassword2')?.value||'';
  if(a.length<6){alert('הסיסמה חייבת להכיל לפחות 6 תווים.');return}if(a!==b){alert('שתי הסיסמאות אינן זהות.');return}
  const base=cloudBase(),key=(db.cloud?.adminKey||'').trim();
  if(!base||!key){alert('כדי להגדיר סיסמה יש קודם להזין כתובת שרת ומפתח מנהל בחלק "קישורים אישיים לזוגות" ולשמור.');return}
  if(appPasswordSet&&!confirm('החלפת הסיסמה תנתק את כל המכשירים שנכנסו עם הסיסמה הקודמת. להמשיך?'))return;
  try{const r=await fetch(base+'/api/admin/password',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify({password:a})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'שגיאת שרת '+r.status);
    if(j.token){db.cloud.adminKey=j.token;writeLocalOnly()}
    appPasswordSet=true;await syncCloudNow('push',true);render();toast('הסיסמה נשמרה. עכשיו אפשר להיכנס גם מהטלפון.')}
  catch(e){alert('לא ניתן לשמור את הסיסמה: '+e.message)}
}
async function logoutThisDevice(){
  if(!confirm('להתנתק מהמכשיר הזה? הנתונים נשארים שמורים בשרת, ותוכלו להיכנס שוב עם הסיסמה.'))return;
  if(isLocalDirty())await syncCloudNow('push',true);
  const key=(db.cloud?.adminKey||'').trim();
  try{await fetch(cloudBase()+'/api/admin/logout',{method:'POST',headers:{'X-Admin-Key':key}})}catch(e){}
  try{localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(LEGACY_STORAGE_KEY)}catch(e){}
  location.replace(location.pathname);
}
async function logoutAllDevices(){
  if(!confirm('לנתק את כל המכשירים שנכנסו עם סיסמה (כולל המכשיר הזה, אם נכנסת בו עם סיסמה)?'))return;
  const key=(db.cloud?.adminKey||'').trim();
  try{const r=await fetch(cloudBase()+'/api/admin/logout-all',{method:'POST',headers:{'X-Admin-Key':key}});if(!r.ok)throw new Error('HTTP '+r.status);toast('כל המכשירים נותקו');if(isSessionLogin()){try{localStorage.removeItem(STORAGE_KEY)}catch(e){}location.replace(location.pathname)}}
  catch(e){alert('הניתוק נכשל: '+e.message)}
}
function installApp(){
  if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.finally(()=>{deferredInstallPrompt=null});return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  alert(ios?'באייפון: פתחו את האתר ב-Safari, לחצו על כפתור השיתוף (ריבוע עם חץ למעלה) ובחרו "הוספה למסך הבית".':'בטלפון אנדרואיד: פתחו את האתר ב-Chrome, לחצו על ⋮ בפינה ובחרו "הוספה למסך הבית" או "התקנת האפליקציה". במחשב: לחצו על סמל ההתקנה בשורת הכתובת של Chrome.');
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});
document.addEventListener('click',e=>{
  if(e.target.closest('#setAppPassword'))setAppPasswordFromForm();
  else if(e.target.closest('#installAppBtn'))installApp();
  else if(e.target.closest('#logoutDevice'))logoutThisDevice();
  else if(e.target.closest('#logoutAllDevices'))logoutAllDevices();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushPendingSync();else backgroundCloudCheck()});
window.addEventListener('pagehide',flushPendingSync);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/manager-sw.js',{scope:'/'}).catch(e=>console.warn('SW:',e.message));
async function initAccess(){
  if(!onServerOrigin())return;
  const status=await refreshAppPasswordStatus();
  if(db.cloud?.adminKey){backgroundCloudCheck(true);return}
  if(status)showLoginScreen();
}
setInterval(()=>{if(document.visibilityState==='visible')backgroundCloudCheck()},60*1000);
(()=>{const mb=document.getElementById('modalBackdrop');if(!mb)return;let wasOpen=mb.classList.contains('show');new MutationObserver(()=>{const open=mb.classList.contains('show');if(wasOpen&&!open)setTimeout(()=>backgroundCloudCheck(true),400);wasOpen=open}).observe(mb,{attributes:true,attributeFilter:['class']})})();
render();
initAccess();
setInterval(checkUpcomingReminders,60*1000);
const calendarNotice=new URLSearchParams(location.search).get('google_calendar');if(calendarNotice){history.replaceState({},'',location.pathname);if(calendarNotice==='connected'){setTimeout(()=>{toast('Google Calendar חובר בהצלחה');if(currentPage!=='settings')go('settings');else refreshGoogleCalendarStatus()},250)}else if(calendarNotice==='error'){setTimeout(()=>alert('חיבור Google Calendar לא הושלם. אפשר לנסות שוב בהגדרות.'),250)}}
})();
</script>
</body>
</html>
